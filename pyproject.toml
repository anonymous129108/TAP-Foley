[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-foley"
version = "0.1.0"
description = "Target-Anchored Projection for Counterfactual Video Foley Generation"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[tool.setuptools.packages.find]
include = ["tap_foley*"]
